<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Kata </title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .category-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .category-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .clue-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            text-align: left;
            min-height: 80px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-hint {
            background-color: #d97706;
            flex: 1;
        }

        .btn-skip {
            background-color: #64748b;
            flex: 1;
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 25px;
            margin-bottom: 15px;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tebak Cepat Indonesia</h1>

    <!-- Menu Utama -->
    <div id="menu-screen">
        <p style="margin-bottom: 20px;">Pilih kategori untuk memulai permainan:</p>
        <div class="category-select">
            <button onclick="startGame('hewan')">🐾 Hewan</button>
            <button onclick="startGame('presiden')">🇮🇩 Presiden RI</button>
            <button onclick="startGame('menteri')">🏛️ Menteri RI</button>
            <button onclick="startGame('pahlawan')">🎖️ Pahlawan</button>
        </div>
    </div>

    <!-- Area Permainan -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <span class="category-badge" id="category-title">Kategori</span>
            <div>Soal: <strong id="question-number">1/10</strong></div>
            <div>Skor: <strong id="score">0</strong></div>
            <div>Waktu: <strong id="timer">30</strong>s</div>
        </div>

        <div class="clue-box">
            <strong>Petunjuk:</strong>
            <p id="clue-text" style="margin-top: 5px;">-</p>
        </div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Ketik jawaban di sini..." autocomplete="off">
            <button onclick="checkAnswer()">Jawab</button>
        </div>

        <div class="action-btns">
            <button class="btn-hint" onclick="useHint()">💡 Petunjuk (<span id="hint-count">2</span>)</button>
            <button class="btn-skip" onclick="nextQuestion()">➡️ Lewati</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <button onclick="backToMenu()" style="background: transparent; color: #94a3b8; text-decoration: underline; width: 100%;">Kembali ke Menu Utama</button>
    </div>
</div>

<script>
    // Database Soal & Petunjuk Lebih Banyak
    const database = {
        hewan: [
            { target: "Komodo", clues: ["Kadal terbesar di dunia", "Endemik dari Nusa Tenggara Timur"] },
            { target: "Harimau Sumatra", clues: ["Kucing besar endemik pulau Sumatra", "Memiliki garis-garis hitam tebal"] },
            { target: "Orangutan", clues: ["Kera besar berambut kemerahan", "Banyak ditemukan di Kalimantan dan Sumatra"] },
            { target: "Cenderawasih", clues: ["Burung indah dijuluki Burung Surga", "Berasal dari wilayah Papua"] },
            { target: "Anoa", clues: ["Mamalia mirip kerbau berukuran kecil", "Endemik pulau Sulawesi"] },
            { target: "Bekantan", clues: ["Monyet berhidung panjang dan besar", "Endemik pulau Kalimantan"] },
            { target: "Gajah Sumatra", clues: ["Mamalia darat terbesar di Indonesia", "Memiliki belalai dan gading"] },
            { target: "Badak Jawa", clues: ["Hewan langka bercula satu", "Banyak dilindungi di Ujung Kulon"] },
            { target: "Tarsius", clues: ["Mamalia kecil bermata sangat besar", "Hewan nokturnal asal Sulawesi"] },
            { target: "Burung Jalak Bali", clues: ["Burung pengicau berwarna putih bersih", "Endemik pulau Bali"] },
            { target: "Gajah", clues: ["Memiliki belalai yang panjang", "Memiliki gading putih di dekat mulutnya"] }
        ],
        presiden: [
            { target: "Soekarno", clues: ["Presiden Indonesia pertama", "Bapak Proklamator Indonesia"] },
            { target: "Soeharto", clues: ["Presiden ke-2 Indonesia", "Memimpin pada masa Orde Baru"] },
            { target: "BJ Habibie", clues: ["Presiden ke-3 Indonesia", "Ahli teknologi penerbangan nasional"] },
            { target: "Gus Dur", clues: ["Presiden ke-4 Indonesia", "Nama aslinya Abdurrahman Wahid"] },
            { target: "Megawati", clues: ["Presiden ke-5 Indonesia", "Presiden wanita pertama di Indonesia"] },
            { target: "Susilo Bambang Yudhoyono", clues: ["Presiden ke-6 Indonesia", "Sering disapa dengan singkatan SBY"] },
            { target: "Joko Widodo", clues: ["Presiden ke-7 Indonesia", "Akrab dipanggil Jokowi"] },
            { target: "Prabowo Subianto", clues: ["Presiden ke-8 Indonesia", "Mantan Danjen Kopassus dan Menhan"] },
            { target: "Mohammad Hatta", clues: ["Wakil Presiden Indonesia pertama", "Bapak Koperasi Indonesia"] },
            { target: "Adam Malik", clues: ["Wakil Presiden ke-3 Indonesia", "Pernah menjabat Menteri Luar Negeri"] }
        ],
        menteri: [
            { target: "Sri Mulyani", clues: ["Menteri Keuangan Republik Indonesia", "Mantan Direktur Pelaksana Bank Dunia"] },
            { target: "Prabowo Subianto", clues: ["Mantan Menteri Pertahanan RI", "Pendiri Partai Gerindra"] },
            { target: "Erick Thohir", clues: ["Menteri Badan Usaha Milik Negara (BUMN)", "Ketua Umum PSSI"] },
            { target: "Bahlil Lahadalia", clues: ["Menteri Energi dan Sumber Daya Mineral (ESDM)", "Mantan Kepala BKPM"] },
            { target: "Airlangga Hartarto", clues: ["Menteri Koordinator Bidang Perekonomian", "Tokoh politik senior Indonesia"] },
            { target: "Nadiem Makarim", clues: ["Mantan Mendikbudristek", "Pendiri platform Gojek"] },
            { target: "Retno Marsudi", clues: ["Mantan Menteri Luar Negeri wanita pertama RI", "Diplomat karir senior"] },
            { target: "Luhut Binsar Pandjaitan", clues: ["Mantan Menko Marves", "Tokoh senior pemerintahan Indonesia"] },
            { target: "Sandiaga Uno", clues: ["Mantan Menparekraf", "Seorang pengusaha nasional"] },
            { target: "AHY", clues: ["Menteri ATR/BPN", "Putra sulung Susilo Bambang Yudhoyono"] }
        ],
        pahlawan: [
            { target: "Diponegoro", clues: ["Pahlawan dari Jawa Tengah", "Memimpin Perang Jawa melawan Belanda"] },
            { target: "Cut Nyak Dhien", clues: ["Pahlawan wanita dari Aceh", "Berjuang gigih melawan penjajah Belanda"] },
            { target: "Ki Hajar Dewantara", clues: ["Bapak Pendidikan Nasional Indonesia", "Pendiri Perguruan Taman Siswa"] },
            { target: "Gajah Mada", clues: ["Panglima perang Kerajaan Majapahit", "Terkenal dengan Sumpah Palapa"] },
            { target: "Kartini", clues: ["Pahlawan emansipasi wanita Indonesia", "Penulis buku 'Habis Gelap Terbitlah Terang'"] },
            { target: "Pattimura", clues: ["Pahlawan nasional dari Maluku", "Gambar wajahnya pernah ada di uang Rp 1.000"] },
            { target: "Sisingamangaraja", clues: ["Raja sekaligus pahlawan dari Sumatra Utara", "Raja Batak ke-XII"] },
            { target: "Bung Tomo", clues: ["Tokoh pengobar semangat dalam Pertempuran 10 November", "Pahlawan dari Surabaya"] },
            { target: "Jenderal Soedirman", clues: ["Panglima besar TNI pertama", "Terkenal dengan taktik perang gerilya"] },
            { target: "I Gusti Ngurah Rai", clues: ["Pahlawan nasional dari Bali", "Memimpin perang Puputan Margarana"] }
        ]
    };

    // Variabel Permainan
    let currentCategory = "";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer = 30;
    let timerInterval = null;
    let hintsLeft = 2;

    // Suara Sederhana dengan Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    function startGame(category) {
        currentCategory = category;
        // Acak urutan soal setiap kali game dimulai
        currentQuestions = [...database[category]].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        document.getElementById('category-title').innerText = category.toUpperCase();
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('score').innerText = score;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            alert(`Selamat! Anda telah menyelesaikan semua soal di kategori ini.\nSkor Akhir Anda: ${score}`);
            backToMenu();
            return;
        }

        clearInterval(timerInterval);
        timer = 30;
        hintsLeft = 2;
        
        document.getElementById('question-number').innerText = `${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('timer').innerText = timer;
        document.getElementById('hint-count').innerText = hintsLeft;
        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";
        
        const q = currentQuestions[currentIndex];
        document.getElementById('clue-text').innerText = q.clues[0];

        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if (timer <= 0) {
                clearInterval(timerInterval);
                playSound('wrong');
                showFeedback("Waktu Habis! Jawaban: " + q.target, false);
                setTimeout(nextQuestion, 2000);
            }
        }, 1000);
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input').value.trim().toLowerCase();
        const target = currentQuestions[currentIndex].target.toLowerCase();

        if (!input) return;

        // Pencocokan jawaban
        if (input === target || (target.includes(input) && input.length >= 3)) {
            clearInterval(timerInterval);
            playSound('correct');
            score += timer * 10;
            document.getElementById('score').innerText = score;
            showFeedback("Jawaban Benar! 🎉", true);
            setTimeout(nextQuestion, 1500);
        } else {
            playSound('wrong');
            showFeedback("Jawaban Salah, coba lagi!", false);
        }
    }

    function useHint() {
        if (hintsLeft <= 0) return;
        const q = currentQuestions[currentIndex];
        hintsLeft--;
        document.getElementById('hint-count').innerText = hintsLeft;

        if (hintsLeft === 1 && q.clues[1]) {
            document.getElementById('clue-text').innerText += " | " + q.clues[1];
        } else {
            const mask = q.target.replace(/[a-zA-Z]/g, (char, index) => index % 2 === 0 ? char : '_');
            document.getElementById('clue-text').innerText += ` | Bocoran: ${mask}`;
        }
    }

    function showFeedback(text, isSuccess) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.className = "feedback " + (isSuccess ? "success" : "error");
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function backToMenu() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
</script>

</body>
</html>
