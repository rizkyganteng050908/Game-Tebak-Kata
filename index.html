<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tebak Cepat Indonesia</title>
<style>
:root{
  --primary:#4f46e5;--primary-hover:#4338ca;--bg:#0f172a;
  --card:#1e293b;--text:#f8fafc;--accent:#f59e0b;
  --danger:#ef4444;--success:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,sans-serif}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;justify-content:center;align-items:center;padding:20px
}
.container{
  width:100%;max-width:600px;background:var(--card);border-radius:16px;
  padding:30px;box-shadow:0 10px 25px rgba(0,0,0,.5);text-align:center
}
h1{font-size:1.8rem;margin-bottom:20px;color:var(--accent)}
.category-select{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
button{
  border:0;border-radius:8px;padding:12px 18px;background:var(--primary);
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer
}
button:hover{background:var(--primary-hover)}
.game-header{
  display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px;
  align-items:center;margin-bottom:20px;background:#334155;padding:10px;
  border-radius:8px;font-size:.9rem
}
.category-badge{
  background:var(--accent);color:#000;padding:5px 8px;border-radius:20px;
  font-size:.78rem;font-weight:700
}
.clue-box{
  background:var(--bg);padding:20px;border-radius:8px;margin-bottom:20px;
  border-left:4px solid var(--accent);text-align:left;min-height:90px
}
.input-group{display:flex;gap:10px;margin-bottom:15px}
input[type=text]{
  width:100%;padding:12px;border-radius:8px;border:2px solid #475569;
  background:var(--bg);color:#fff;font-size:1rem;outline:none
}
input[type=text]:focus{border-color:var(--primary)}
.action-btns{display:flex;gap:10px;margin-bottom:20px}
.btn-hint{background:#d97706;flex:1}
.btn-skip{background:#64748b;flex:1}
.feedback{font-weight:700;font-size:1.1rem;min-height:28px;margin-bottom:15px}
.success{color:var(--success)}.error{color:var(--danger)}
.hidden{display:none!important}
.back{background:transparent;color:#94a3b8;text-decoration:underline;width:100%}
@media(max-width:520px){
  body{padding:10px}.container{padding:20px}
  .game-header{grid-template-columns:1fr 1fr;font-size:.8rem}
  .category-select{grid-template-columns:1fr}
  .input-group{flex-direction:column}
}

.add-question-btn{
  margin-top:15px;background:#16a34a;width:100%;
}
.add-question-btn:hover{background:#15803d}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;
  padding:15px;z-index:1000
}
.modal-box{
  width:100%;max-width:500px;background:#1e293b;border-radius:14px;
  padding:25px;box-shadow:0 15px 40px rgba(0,0,0,.6);text-align:left
}
.modal-box h2{text-align:center;margin-bottom:18px;color:#f59e0b}
.form-group{margin-bottom:13px}
.form-group label{display:block;margin-bottom:6px;font-weight:700}
.form-group input,.form-group textarea,.form-group select{
  width:100%;padding:11px;border-radius:7px;border:2px solid #475569;
  background:#0f172a;color:#fff;font-size:1rem;outline:none
}
.form-group textarea{min-height:75px;resize:vertical}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions button{flex:1}
.btn-cancel{background:#64748b}
.add-success{color:#22c55e;text-align:center;margin-top:10px;font-weight:700}

</style>
</head>
<body>

<div class="container">
  <h1>🧠 Tebak Cepat Indonesia</h1>

  <div id="menu-screen">
    <p style="margin-bottom:20px">Pilih kategori untuk memulai permainan:</p>
    <div class="category-select">
      <button type="button" onclick="startGame('hewan')">🐾 Hewan</button>
      <button type="button" onclick="startGame('presiden')">🇮🇩 Presiden &amp; Wapres</button>
      <button type="button" onclick="startGame('menteri')">🏛️ Menteri RI</button>
      <button type="button" onclick="startGame('pahlawan')">🎖️ Pahlawan</button>
    </div>
    <button type="button" class="add-question-btn" onclick="openAddQuestion()">➕ Tambah Soal</button>
  </div>

  <div id="game-screen" class="hidden">
    <div class="game-header">
      <span class="category-badge" id="category-title">Kategori</span>
      <div>Soal: <strong id="question-number">1/1</strong></div>
      <div>Skor: <strong id="score">0</strong></div>
      <div>Waktu: <strong id="timer">30</strong>s</div>
    </div>

    <div class="clue-box">
      <strong>Petunjuk:</strong>
      <p id="clue-text" style="margin-top:8px">-</p>
    </div>

    <div class="input-group">
      <input type="text" id="answer-input" placeholder="Ketik jawaban di sini..." autocomplete="off">
      <button type="button" onclick="checkAnswer()">Jawab</button>
    </div>

    <div class="action-btns">
      <button type="button" class="btn-hint" onclick="useHint()">💡 Petunjuk (<span id="hint-count">2</span>)</button>
      <button type="button" class="btn-skip" onclick="nextQuestion()">➡️ Lewati</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <button type="button" class="back" onclick="backToMenu()">Kembali ke Menu Utama</button>
  </div>
</div>

<script>
/* DATABASE SOAL - TANPA ADMIN */
const database = {
  hewan: [
    {target:"Komodo",aliases:["komodo"],clues:["Kadal terbesar di dunia","Endemik dari Nusa Tenggara Timur"]},
    {target:"Harimau Sumatra",aliases:["harimau sumatra","harimau sumatera","harimau"],clues:["Kucing besar endemik Pulau Sumatra","Memiliki garis-garis hitam tebal"]},
    {target:"Orangutan",aliases:["orangutan","orang utan"],clues:["Primata yang hidup di hutan Indonesia","Banyak ditemukan di Kalimantan dan Sumatra"]},
    {target:"Cenderawasih",aliases:["cenderawasih","burung cenderawasih"],clues:["Burung indah dari Papua","Dikenal sebagai burung surga"]},
    {target:"Kura-kura",aliases:["kura-kura","kura kura"],clues:["Hewan yang membawa cangkang di tubuhnya","Berjalan dengan lambat"]},
    {target:"Jerapah",aliases:["jerapah"],clues:["Hewan dengan leher yang sangat panjang","Banyak ditemukan di Afrika"]},
    {target:"Gajah",aliases:["gajah"],clues:["Hewan besar dengan belalai","Memiliki telinga yang lebar"]},
    {target:"Kucing",aliases:["kucing"],clues:["Hewan yang sering dipelihara di rumah","Suka mengeong"]},
    {target:"Domba",aliases:["domba"],clues:["Hewan berbulu tebal","Menghasilkan wol"]},
    {target:"Sapi",aliases:["sapi"],clues:["Hewan ternak pemakan rumput","Menghasilkan susu"]},
    {target:"Kuda",aliases:["kuda"],clues:["Hewan yang sering digunakan untuk ditunggangi","Memiliki surai"]},
    {target:"Harimau",aliases:["harimau"],clues:["Kucing besar pemakan daging","Memiliki belang hitam"]},
    {target:"Singa",aliases:["singa"],clues:["Dikenal sebagai raja hutan","Singa jantan memiliki surai"]},
    {target:"Macan",aliases:["macan"],clues:["Hewan pemakan daging dari keluarga kucing","Memiliki tubuh yang kuat dan lincah"]},
    {target:"Burung",aliases:["burung"],clues:["Hewan yang memiliki sayap dan paruh","Banyak jenisnya dapat terbang"]},
    {target:"Burung Beo",aliases:["burung beo","beo"],clues:["Burung yang terkenal dapat menirukan suara","Memiliki paruh yang kuat"]},
    {target:"Burung Kakatua",aliases:["burung kakatua","kakatua"],clues:["Burung yang memiliki jambul di kepalanya","Terkenal dengan suaranya yang keras"]},
    {target:"Burung Merak",aliases:["burung merak","merak"],clues:["Burung yang memiliki ekor sangat indah","Sering membuka ekornya seperti kipas"]},
    {target:"Buaya",aliases:["buaya"],clues:["Reptil besar yang hidup di air dan darat","Memiliki rahang dan gigi yang kuat"]},
    {target:"Serigala",aliases:["serigala"],clues:["Hewan pemakan daging yang hidup berkelompok","Mirip anjing tetapi hidup liar"]}
  ],
  presiden: [
    {target:"Soekarno",aliases:["soekarno","sukarno","bung karno"],clues:["Presiden Indonesia pertama","Bapak Proklamator Indonesia"]},
    {target:"Soeharto",aliases:["soeharto","suharto"],clues:["Presiden kedua Indonesia","Memimpin Indonesia selama Orde Baru"]},
    {target:"B. J. Habibie",aliases:["b.j. habibie","bj habibie","habibie"],clues:["Presiden Indonesia ketiga","Dikenal sebagai tokoh teknologi Indonesia"]},
    {target:"Joko Widodo",aliases:["joko widodo","jokowi"],clues:["Presiden Indonesia ketujuh","Sering dikenal dengan nama Jokowi"]}
  ],
  menteri: [
    {target:"Sri Mulyani",aliases:["sri mulyani","sri mulyani indrawati"],clues:["Tokoh yang pernah menjabat Menteri Keuangan RI","Pernah menjadi Direktur Pelaksana Bank Dunia"]},
    {target:"Budi Gunadi Sadikin",aliases:["budi gunadi sadikin","budi sadikin"],clues:["Tokoh yang pernah menjabat Menteri Kesehatan RI","Sebelumnya berkarier di sektor perbankan"]},
    {target:"Erick Thohir",aliases:["erick thohir","erick"],clues:["Menteri BUMN yang pernah menjabat","Juga dikenal sebagai pengusaha dan tokoh olahraga"]}
  ],
  pahlawan: [
    {target:"Diponegoro",aliases:["diponegoro","pangeran diponegoro"],clues:["Pahlawan dari Jawa","Memimpin Perang Jawa melawan Belanda"]},
    {target:"Cut Nyak Dien",aliases:["cut nyak dien","cut nyak dhien"],clues:["Pahlawan perempuan dari Aceh","Berjuang melawan Belanda"]},
    {target:"Ki Hajar Dewantara",aliases:["ki hajar dewantara","ki hajar"],clues:["Tokoh pendidikan Indonesia","Pendiri Perguruan Taman Siswa"]}
  ]
};


/* Soal tambahan disimpan di browser perangkat ini */
const savedCustomQuestions = JSON.parse(localStorage.getItem("tebak_kata_custom_questions") || "{}");
Object.keys(savedCustomQuestions).forEach(category => {
  if (Array.isArray(savedCustomQuestions[category]) && database[category]) {
    database[category].push(...savedCustomQuestions[category]);
  }
});

let currentCategory="";
let currentQuestions=[];
let currentIndex=0;
let score=0;
let timer=30;
let timerInterval=null;
let hintsLeft=2;
let answerLocked=false;

function startGame(category){
  if(!database[category] || database[category].length===0){
    alert("Kategori ini belum memiliki soal.");
    return;
  }

  clearInterval(timerInterval);
  currentCategory=category;
  currentQuestions=[...database[category]].sort(()=>Math.random()-0.5);
  currentIndex=0;
  score=0;
  answerLocked=false;

  document.getElementById("menu-screen").classList.add("hidden");
  document.getElementById("game-screen").classList.remove("hidden");
  document.getElementById("category-title").textContent=getCategoryName(category);
  document.getElementById("score").textContent=score;

  loadQuestion();
}

function getCategoryName(category){
  const names={
    hewan:"🐾 HEWAN",
    presiden:"🇮🇩 PRESIDEN & WAPRES",
    menteri:"🏛️ MENTERI RI",
    pahlawan:"🎖️ PAHLAWAN"
  };
  return names[category] || category.toUpperCase();
}

function loadQuestion(){
  clearInterval(timerInterval);

  if(currentIndex>=currentQuestions.length){
    finishGame();
    return;
  }

  const q=currentQuestions[currentIndex];
  timer=30;
  hintsLeft=2;
  answerLocked=false;

  document.getElementById("question-number").textContent=(currentIndex+1)+"/"+currentQuestions.length;
  document.getElementById("timer").textContent=timer;
  document.getElementById("hint-count").textContent=hintsLeft;
  document.getElementById("answer-input").value="";
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("clue-text").textContent=q.clues[0];

  setTimeout(()=>document.getElementById("answer-input").focus(),50);

  timerInterval=setInterval(()=>{
    timer--;
    document.getElementById("timer").textContent=timer;

    if(timer<=0){
      clearInterval(timerInterval);
      answerLocked=true;
      showFeedback("⏰ Waktu habis! Jawaban: "+q.target,false);
      setTimeout(nextQuestion,1500);
    }
  },1000);
}

function normalizeAnswer(text){
  return text.toLowerCase().trim().replace(/\s+/g," ");
}

function checkAnswer(){
  if(answerLocked) return;

  const input=normalizeAnswer(document.getElementById("answer-input").value);
  if(!input) return;

  const q=currentQuestions[currentIndex];
  const correct=q.aliases.some(alias=>normalizeAnswer(alias)===input);

  if(correct){
    answerLocked=true;
    clearInterval(timerInterval);
    score+=timer*10;
    document.getElementById("score").textContent=score;
    showFeedback("🎉 Jawaban benar!",true);
    setTimeout(nextQuestion,1000);
  }else{
    showFeedback("❌ Jawaban salah, coba lagi!",false);
  }
}

function useHint(){
  if(answerLocked || hintsLeft<=0) return;

  const q=currentQuestions[currentIndex];
  hintsLeft--;
  document.getElementById("hint-count").textContent=hintsLeft;

  if(hintsLeft===1 && q.clues[1]){
    document.getElementById("clue-text").textContent=q.clues[0]+" | "+q.clues[1];
  }else{
    const mask=q.target.replace(/[A-Za-z]/g,(char,i)=>i%2===0?char:"_");
    document.getElementById("clue-text").textContent=q.clues[0]+" | Bocoran: "+mask;
  }
}

function showFeedback(text,success){
  const fb=document.getElementById("feedback");
  fb.textContent=text;
  fb.className="feedback "+(success?"success":"error");
}

function nextQuestion(){
  clearInterval(timerInterval);
  if(answerLocked || currentIndex<currentQuestions.length){
    currentIndex++;
    loadQuestion();
  }
}

function finishGame(){
  clearInterval(timerInterval);
  alert("🎉 Permainan selesai!\nSkor akhir: "+score);
  backToMenu();
}

function backToMenu(){
  clearInterval(timerInterval);
  answerLocked=true;
  document.getElementById("game-screen").classList.add("hidden");
  document.getElementById("menu-screen").classList.remove("hidden");
}


function openAddQuestion(){
  document.getElementById("add-question-modal").classList.remove("hidden");
  document.getElementById("add-success").textContent="";
  document.getElementById("new-target").value="";
  document.getElementById("new-aliases").value="";
  document.getElementById("new-clue1").value="";
  document.getElementById("new-clue2").value="";
}

function closeAddQuestion(){
  document.getElementById("add-question-modal").classList.add("hidden");
}

function saveNewQuestion(){
  const category=document.getElementById("new-category").value;
  const target=document.getElementById("new-target").value.trim();
  const aliasesText=document.getElementById("new-aliases").value.trim();
  const clue1=document.getElementById("new-clue1").value.trim();
  const clue2=document.getElementById("new-clue2").value.trim();

  if(!target || !clue1){
    alert("Jawaban dan Petunjuk 1 wajib diisi.");
    return;
  }

  const aliases=aliasesText
    ? aliasesText.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)
    : [];

  const targetNormalized=normalizeAnswer(target);
  if(!aliases.includes(targetNormalized)) aliases.unshift(targetNormalized);

  const newQuestion={
    target:target,
    aliases:aliases,
    clues:clue2 ? [clue1,clue2] : [clue1]
  };

  database[category].push(newQuestion);

  const saved=JSON.parse(localStorage.getItem("tebak_kata_custom_questions") || "{}");
  if(!Array.isArray(saved[category])) saved[category]=[];
  saved[category].push(newQuestion);
  localStorage.setItem("tebak_kata_custom_questions",JSON.stringify(saved));

  if(currentCategory===category) currentQuestions.push(newQuestion);

  document.getElementById("add-success").textContent="✅ Soal berhasil ditambahkan dan disimpan!";
  setTimeout(closeAddQuestion,900);
}

document.getElementById("add-question-modal").addEventListener("click",function(e){
  if(e.target===this) closeAddQuestion();
});

document.getElementById("answer-input").addEventListener("keydown",function(e){
  if(e.key==="Enter") checkAnswer();
});
</script>

<div id="add-question-modal" class="modal hidden">
  <div class="modal-box">
    <h2>➕ Tambah Soal</h2>

    <div class="form-group">
      <label for="new-category">Kategori</label>
      <select id="new-category">
        <option value="hewan">🐾 Hewan</option>
        <option value="presiden">🇮🇩 Presiden & Wapres</option>
        <option value="menteri">🏛️ Menteri RI</option>
        <option value="pahlawan">🎖️ Pahlawan</option>
      </select>
    </div>

    <div class="form-group">
      <label for="new-target">Jawaban</label>
      <input id="new-target" type="text" placeholder="Contoh: Gajah">
    </div>

    <div class="form-group">
      <label for="new-aliases">Jawaban alternatif <small>(opsional, pisahkan dengan koma)</small></label>
      <input id="new-aliases" type="text" placeholder="Contoh: gajah asia, elephant">
    </div>

    <div class="form-group">
      <label for="new-clue1">Petunjuk 1</label>
      <textarea id="new-clue1" placeholder="Masukkan petunjuk pertama"></textarea>
    </div>

    <div class="form-group">
      <label for="new-clue2">Petunjuk 2</label>
      <textarea id="new-clue2" placeholder="Masukkan petunjuk kedua"></textarea>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" onclick="closeAddQuestion()">Batal</button>
      <button type="button" onclick="saveNewQuestion()">💾 Simpan Soal</button>
    </div>
    <div id="add-success" class="add-success"></div>
  </div>
</div>

</body>
</html>
