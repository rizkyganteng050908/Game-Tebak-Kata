<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Kata Indonesia</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .category-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .category-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .clue-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            text-align: left;
            min-height: 80px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-hint {
            background-color: #d97706;
            flex: 1;
        }

        .btn-skip {
            background-color: #64748b;
            flex: 1;
        }

        .feedback {
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 25px;
            margin-bottom: 15px;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tebak Cepat Indonesia</h1>

    <!-- Menu Utama -->
    <div id="menu-screen">
        <p style="margin-bottom: 20px;">Pilih kategori untuk memulai permainan:</p>
        <div class="category-select">
            <button onclick="startGame('hewan')">🐾 Hewan</button>
            <button onclick="startGame('presiden')">🇮🇩 Presiden & Wapres</button>
            <button onclick="startGame('menteri')">🏛️ Menteri RI</button>
            <button onclick="startGame('pahlawan')">🎖️ Pahlawan</button>
        </div>
    </div>

    <!-- Area Permainan -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <span class="category-badge" id="category-title">Kategori</span>
            <div>Soal: <strong id="question-number">1/10</strong></div>
            <div>Skor: <strong id="score">0</strong></div>
            <div>Waktu: <strong id="timer">30</strong>s</div>
        </div>

        <div class="clue-box">
            <strong>Petunjuk:</strong>
            <p id="clue-text" style="margin-top: 5px;">-</p>
        </div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Ketik jawaban di sini..." autocomplete="off">
            <button onclick="checkAnswer()">Jawab</button>
        </div>

        <div class="action-btns">
            <button class="btn-hint" onclick="useHint()">💡 Petunjuk (<span id="hint-count">2</span>)</button>
            <button class="btn-skip" onclick="nextQuestion()">➡️ Lewati</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <button onclick="backToMenu()" style="background: transparent; color: #94a3b8; text-decoration: underline; width: 100%;">Kembali ke Menu Utama</button>
    </div>
</div>

<script>
    // Database Soal & Petunjuk
    const database = {
        hewan: [
            { target: "Komodo", aliases: ["komodo"], clues: ["Kadal terbesar di dunia", "Endemik dari Nusa Tenggara Timur"] },
            { target: "Harimau Sumatra", aliases: ["harimau sumatra", "harimau sumatera", "harimau"], clues: ["Kucing besar endemik pulau Sumatra", "Memiliki garis-garis hitam tebal"] },
            { target: "Orangutan", aliases: ["orangutan", "orang utan"], clues: ["Kera besar berambut kemerahan", "Banyak ditemukan di Kalimantan dan Sumatra"] },
            { target: "Cenderawasih", aliases: ["cenderawasih", "cendrawasih"], clues: ["Burung indah dijuluki Burung Surga", "Berasal dari wilayah Papua"] },
            { target: "Anoa", aliases: ["anoa"], clues: ["Mamalia mirip kerbau berukuran kecil", "Endemik pulau Sulawesi"] },
            { target: "Bekantan", aliases: ["bekantan"], clues: ["Monyet berhidung panjang dan besar", "Endemik pulau Kalimantan"] },
            { target: "Gajah Sumatra", aliases: ["gajah sumatra", "gajah sumatera"], clues: ["Subspesies gajah asia yang hidup di Sumatra", "Berukuran sedikit lebih kecil dari gajah asia umumnya"] },
            { target: "Badak Jawa", aliases: ["badak jawa", "badak bercula satu"], clues: ["Hewan langka bercula satu", "Banyak dilindungi di Ujung Kulon"] },
            { target: "Tarsius", aliases: ["tarsius"], clues: ["Mamalia kecil bermata sangat besar", "Hewan nokturnal asal Sulawesi"] },
            { target: "Jalak Bali", aliases: ["jalak bali", "burung jalak bali"], clues: ["Burung pengicau berwarna putih bersih", "Endemik pulau Bali"] },
            { target: "Gajah", aliases: ["gajah"], clues: ["Memiliki belalai yang panjang", "Memiliki gading putih di dekat mulutnya"] }
        ],
        presiden: [
            { target: "Soekarno", aliases: ["soekarno", "sukarno", "bung karno"], clues: ["Presiden Indonesia pertama", "Bapak Proklamator Indonesia"] },
            { target: "Soeharto", aliases: ["soeharto", "suharto", "pak harto"], clues: ["Presiden ke-2 Indonesia", "Memimpin pada masa Orde Baru"] },
            { target: "BJ Habibie", aliases: ["bj habibie", "habibie", "b.j. habibie"], clues: ["Presiden ke-3 Indonesia", "Ahli teknologi penerbangan nasional"] },
            { target: "Gus Dur", aliases: ["gus dur", "abdurrahman wahid", "gusdur"], clues: ["Presiden ke-4 Indonesia", "Bapak Pluralisme Indonesia"] },
            { target: "Megawati Soekarnoputri", aliases: ["megawati", "megawati soekarnoputri", "mega"], clues: ["Presiden ke-5 Indonesia", "Presiden wanita pertama di Indonesia"] },
            { target: "Susilo Bambang Yudhoyono", aliases: ["susilo bambang yudhoyono", "sby"], clues: ["Presiden ke-6 Indonesia", "Presiden pertama yang dipilih langsung lewat pemilu"] },
            { target: "Joko Widodo", aliases: ["joko widodo", "jokowi"], clues: ["Presiden ke-7 Indonesia", "Mantan Gubernur DKI Jakarta dan Wali Kota Surakarta"] },
            { target: "Prabowo Subianto", aliases: ["prabowo", "prabowo subianto"], clues: ["Presiden ke-8 Indonesia", "Mantan Danjen Kopassus dan Menhan RI"] },
            { target: "Mohammad Hatta", aliases: ["mohammad hatta", "bung hatta", "moch hatta"], clues: ["Wakil Presiden Indonesia pertama", "Bapak Koperasi Indonesia"] },
            { target: "Adam Malik", aliases: ["adam malik"], clues: ["Wakil Presiden ke-3 Indonesia", "Pernah menjabat Menteri Luar Negeri dan Ketua DPR"] },
            { target: "Hamengkubuwono IX", aliases: ["hamengkubuwono ix", "sultan hamengkubuwono ix"], clues: ["Wakil Presiden ke-2 Indonesia", "Sultan Yogyakarta dan Bapak Pramuka Indonesia"] },
            { target: "Jusuf Kalla", aliases: ["jusuf kalla", "jk"], clues: ["Wakil Presiden RI yang menjabat 2 kali di periode berbeda", "Mendampingi SBY dan Jokowi"] },
            { target: "Ma'ruf Amin", aliases: ["ma'ruf amin", "maruf amin"], clues: ["Wakil Presiden ke-13 Indonesia", "Mantan Ketua Umum Majelis Ulama Indonesia (MUI)"] },
            { target: "Gibran Rakabuming Raka", aliases: ["gibran", "gibran rakabuming", "gibran rakabuming raka"], clues: ["Wakil Presiden ke-14 Indonesia", "Wakil Presiden termuda dalam sejarah Indonesia"] }
        ],
        menteri: [
            { target: "Sri Mulyani", aliases: ["sri mulyani", "sri mulyani indrawati"], clues: ["Menteri Keuangan Republik Indonesia di beberapa era", "Mantan Direktur Pelaksana Bank Dunia"] },
            { target: "Erick Thohir", aliases: ["erick thohir", "erik thohir"], clues: ["Menteri BUMN Indonesia", "Ketua Umum PSSI periode 2023–2027"] },
            { target: "Bahlil Lahadalia", aliases: ["bahlil", "bahlil lahadalia"], clues: ["Menteri ESDM RI", "Mantan Kepala BKPM dan Tokoh HIPMI"] },
            { target: "Airlangga Hartarto", aliases: ["airlangga", "airlangga hartarto"], clues: ["Menteri Koordinator Bidang Perekonomian RI", "Mantan Ketua Umum Partai Golkar"] },
            { target: "Nadiem Makarim", aliases: ["nadiem", "nadiem makarim"], clues: ["Mantan Mendikbudristek RI", "Pendiri platform Gojek"] },
            { target: "Retno Marsudi", aliases: ["retno marsudi", "retno"], clues: ["Mantan Menteri Luar Negeri wanita pertama RI", "Diplomat senior Indonesia"] },
            { target: "Luhut Binsar Pandjaitan", aliases: ["luhut", "luhut binsar pandjaitan", "luhut pandjaitan"], clues: ["Mantan Menko Marves", "Tokoh senior purnawirawan TNI dan pemerintahan"] },
            { target: "Sandiaga Uno", aliases: ["sandiaga uno", "sandi uno"], clues: ["Mantan Menparekraf", "Pengusaha muda dan mantan Wagub DKI Jakarta"] },
            { target: "AHY", aliases: ["ahy", "agus harimurti yudhoyono", "agus yudhoyono"], clues: ["Menteri ATR/BPN / Menko Infrastruktur", "Putra sulung Presiden Susilo Bambang Yudhoyono"] },
            { target: "Basuki Hadimuljono", aliases: ["basuki hadimuljono", "pak bas", "basuki"], clues: ["Mantan Menteri PUPR yang identik dengan gaya nyentrik", "Sering memegang kamera fotografer di ajang internasional"] },
            { target: "Susi Pudjiastuti", aliases: ["susi pudjiastuti", "bu susi"], clues: ["Mantan Menteri Kelautan dan Perikanan", "Terkenal dengan jargon 'Tenggelamkan!'"] },
            { target: "Mahfud MD", aliases: ["mahfud md", "mahfud"], clues: ["Mantan Menko Polhukam RI", "Pernah menjabat Ketua Mahkamah Konstitusi"] },
            { target: "Zulkifli Hasan", aliases: ["zulkifli hasan", "zulhas"], clues: ["Menteri Perdagangan / Menko Pangan RI", "Ketua Umum Partai Amanat Nasional (PAN)"] },
            { target: "Tito Karnavian", aliases: ["tito karnavian", "tito"], clues: ["Menteri Dalam Negeri RI", "Mantan Kapolri"] }
        ],
        pahlawan: [
            { target: "Diponegoro", aliases: ["diponegoro", "pangeran diponegoro"], clues: ["Pahlawan dari Jawa Tengah", "Memimpin Perang Jawa melawan Belanda (1825–1830)"] },
            { target: "Cut Nyak Dhien", aliases: ["cut nyak dhien", "cut nyak dien"], clues: ["Pahlawan wanita dari Aceh", "Berjuang gigih melawan penjajah Belanda"] },
            { target: "Ki Hajar Dewantara", aliases: ["ki hajar dewantara"], clues: ["Bapak Pendidikan Nasional Indonesia", "Pendiri Perguruan Taman Siswa"] },
            { target: "Gajah Mada", aliases: ["gajah mada"], clues: ["Panglima perang Kerajaan Majapahit", "Terkenal dengan Sumpah Palapa"] },
            { target: "Kartini", aliases: ["kartini", "raden ajeng kartini", "r.a. kartini"], clues: ["Pahlawan emansipasi wanita Indonesia", "Penulis surat-surat 'Habis Gelap Terbitlah Terang'"] },
            { target: "Pattimura", aliases: ["pattimura", "kapitan pattimura"], clues: ["Pahlawan nasional dari Maluku", "Gambar wajahnya pernah diabadikan di uang kertas Rp 1.000"] },
            { target: "Sisingamangaraja", aliases: ["sisingamangaraja", "sisingamangaraja xii"], clues: ["Raja sekaligus pahlawan dari Sumatra Utara", "Raja Batak ke-XII"] },
            { target: "Bung Tomo", aliases: ["bung tomo", "sutomo"], clues: ["Tokoh pengobar semangat dalam Pertempuran 10 November", "Pahlawan orator dari Surabaya"] },
            { target: "Jenderal Soedirman", aliases: ["jenderal soedirman", "soedirman", "sudirman"], clues: ["Panglima besar TNI pertama", "Terkenal dengan taktik perang gerilya saat sakit"] },
            { target: "I Gusti Ngurah Rai", aliases: ["i gusti ngurah rai", "ngurah rai"], clues: ["Pahlawan nasional dari Bali", "Memimpin perang Puputan Margarana"] }
        ]
    };

    // Variabel Permainan
    let currentCategory = "";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer = 30;
    let timerInterval = null;
    let hintsLeft = 2;

    // Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    function startGame(category) {
        currentCategory = category;
        currentQuestions = [...database[category]].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;
        
        document.getElementById('category-title').innerText = category.toUpperCase();
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('score').innerText = score;
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            alert(`Selamat! Anda telah menyelesaikan semua soal di kategori ini.\nSkor Akhir Anda: ${score}`);
            backToMenu();
            return;
        }

        clearInterval(timerInterval);
        timer = 30;
        hintsLeft = 2;
        
        document.getElementById('question-number').innerText = `${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('timer').innerText = timer;
        document.getElementById('hint-count').innerText = hintsLeft;
        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";
        
        const q = currentQuestions[currentIndex];
        document.getElementById('clue-text').innerText = q.clues[0];

        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if (timer <= 0) {
                clearInterval(timerInterval);
                playSound('wrong');
                showFeedback("Waktu Habis! Jawaban: " + q.target, false);
                setTimeout(nextQuestion, 2000);
            }
        }, 1000);
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input').value.trim().toLowerCase();
        const q = currentQuestions[currentIndex];

        if (!input) return;

        // Pencocokan presisi menggunakan array aliases
        const isCorrect = q.aliases.some(alias => alias === input);

        if (isCorrect) {
            clearInterval(timerInterval);
            playSound('correct');
            score += timer * 10;
            document.getElementById('score').innerText = score;
            showFeedback("Jawaban Benar! 🎉", true);
            setTimeout(nextQuestion, 1500);
        } else {
            playSound('wrong');
            showFeedback("Jawaban Salah, coba lagi!", false);
        }
    }

    function useHint() {
        if (hintsLeft <= 0) return;
        const q = currentQuestions[currentIndex];
        hintsLeft--;
        document.getElementById('hint-count').innerText = hintsLeft;

        if (hintsLeft === 1 && q.clues[1]) {
            document.getElementById('clue-text').innerText += " | " + q.clues[1];
        } else {
            const mask = q.target.replace(/[a-zA-Z]/g, (char, index) => index % 2 === 0 ? char : '_');
            document.getElementById('clue-text').innerText += ` | Bocoran: ${mask}`;
        }
    }

    function showFeedback(text, isSuccess) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.className = "feedback " + (isSuccess ? "success" : "error");
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function backToMenu() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
</script>

</body>
</html>
