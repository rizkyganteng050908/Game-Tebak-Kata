<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tebak Cepat Indonesia - Mode Admin</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .category-select {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .admin-section {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #475569;
            display: flex;
            gap: 10px;
        }

        .btn-admin {
            background-color: #059669;
            flex: 1;
        }
        .btn-admin:hover { background-color: #047857; }

        .btn-manage {
            background-color: #0284c7;
            flex: 1;
        }
        .btn-manage:hover { background-color: #0369a1; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .category-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .clue-box {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            text-align: left;
            min-height: 80px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus, select:focus { border-color: var(--primary); }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-hint { background-color: #d97706; flex: 1; }
        .btn-skip { background-color: #64748b; flex: 1; }

        .feedback {
            font-weight: bold;
            font-size: 1.1rem;
            min-height: 25px;
            margin-bottom: 15px;
        }

        .success { color: var(--success); }
        .error { color: var(--danger); }

        /* Modal Custom */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            text-align: left;
            max-height: 85vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .question-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #0f172a;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .btn-delete {
            background-color: var(--danger);
            padding: 5px 10px;
            font-size: 0.8rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tebak Cepat Indonesia</h1>

    <!-- Menu Utama -->
    <div id="menu-screen">
        <p style="margin-bottom: 20px;">Pilih kategori untuk memulai permainan:</p>
        <div class="category-select">
            <button onclick="startGame('hewan')">🐾 Hewan</button>
            <button onclick="startGame('presiden')">🇮🇩 Presiden & Wapres</button>
            <button onclick="startGame('menteri')">🏛 Menteri RI</button>
            <button onclick="startGame('pahlawan')">🎖️ Pahlawan</button>
        </div>

        <div class="admin-section">
            <button class="btn-admin" onclick="requestAdminAccess('add')">🔒 Tambah Soal (Admin)</button>
            <button class="btn-manage" onclick="requestAdminAccess('manage')">⚙️ Kelola Soal</button>
        </div>
    </div>

    <!-- Area Permainan -->
    <div id="game-screen" class="hidden">
        <div class="game-header">
            <span class="category-badge" id="category-title">Kategori</span>
            <div>Soal: <strong id="question-number">1/10</strong></div>
            <div>Skor: <strong id="score">0</strong></div>
            <div>Waktu: <strong id="timer">30</strong>s</div>
        </div>

        <div class="clue-box">
            <strong>Petunjuk:</strong>
            <p id="clue-text" style="margin-top: 5px;">-</p>
        </div>

        <div class="input-group">
            <input type="text" id="answer-input" placeholder="Ketik jawaban di sini..." autocomplete="off">
            <button onclick="checkAnswer()">Jawab</button>
        </div>

        <div class="action-btns">
            <button class="btn-hint" onclick="useHint()">💡 Petunjuk (<span id="hint-count">2</span>)</button>
            <button class="btn-skip" onclick="nextQuestion()">➡️ Lewati</button>
        </div>

        <div class="feedback" id="feedback"></div>

        <button onclick="backToMenu()" style="background: transparent; color: #94a3b8; text-decoration: underline; width: 100%;">Kembali ke Menu Utama</button>
    </div>
</div>

<!-- Modal Password Admin -->
<div id="login-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 380px;">
        <h2 style="margin-bottom: 15px; color: var(--accent);">Login Admin</h2>
        <div class="form-group">
            <label>Username:</label>
            <input type="text" id="admin-username-input" placeholder="Username...">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="admin-password-input" placeholder="Password...">
        </div>
        <p id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 10px;" class="hidden">Username atau password salah!</p>
        <div style="display: flex; gap: 10px;">
            <button onclick="verifyCredentials()" style="flex: 1; background-color: var(--success);">Masuk</button>
            <button onclick="closeLoginModal()" style="flex: 1; background-color: var(--danger);">Batal</button>
        </div>
    </div>
</div>

<!-- Modal Tambah Soal (Admin Only) -->
<div id="add-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="margin-bottom: 15px; color: var(--accent);">Tambah Soal Baru</h2>
        <form id="add-question-form" onsubmit="saveCustomQuestion(event)">
            <div class="form-group">
                <label>Kategori:</label>
                <select id="new-category" required>
                    <option value="hewan">Hewan</option>
                    <option value="presiden">Presiden & Wapres</option>
                    <option value="menteri">Menteri RI</option>
                    <option value="pahlawan">Pahlawan</option>
                </select>
            </div>
            <div class="form-group">
                <label>Jawaban Utama (Target):</label>
                <input type="text" id="new-target" placeholder="Contoh: Kucing" required>
            </div>
            <div class="form-group">
                <label>Alias/Variasi Jawaban (pisahkan dengan koma):</label>
                <input type="text" id="new-aliases" placeholder="Contoh: kucing, mpus, cat" required>
            </div>
            <div class="form-group">
                <label>Petunjuk Utama (Clue 1):</label>
                <input type="text" id="new-clue1" placeholder="Contoh: Suaranya meong" required>
            </div>
            <div class="form-group">
                <label>Petunjuk Tambahan (Clue 2 - Opsional):</label>
                <input type="text" id="new-clue2" placeholder="Contoh: Suka makan ikan">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" style="flex: 1; background-color: var(--success);">Simpan</button>
                <button type="button" onclick="closeAddModal()" style="flex: 1; background-color: var(--danger);">Batal</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal Kelola Soal -->
<div id="manage-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="margin-bottom: 15px; color: var(--accent);">Kelola Daftar Soal</h2>
        <div class="form-group">
            <label>Pilih Kategori:</label>
            <select id="manage-category-select" onchange="renderQuestionList()">
                <option value="hewan">Hewan</option>
                <option value="presiden">Presiden & Wapres</option>
                <option value="menteri">Menteri RI</option>
                <option value="pahlawan">Pahlawan</option>
            </select>
        </div>
        <div id="question-list-container"></div>
        <button onclick="closeManageModal()" style="width: 100%; margin-top: 15px; background-color: #64748b;">Tutup</button>
    </div>
</div>

<script>
    // Kredensial Login Admin
    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "Gue admin";

    const defaultDatabase = {
        hewan: [
            { target: "Komodo", aliases: ["komodo"], clues: ["Kadal terbesar di dunia", "Endemik dari Nusa Tenggara Timur"] },
            { target: "Harimau Sumatra", aliases: ["harimau sumatra", "harimau sumatera", "harimau"], clues: ["Kucing besar endemik pulau Sumatra", "Memiliki garis-garis hitam tebal"] }
        ],
        presiden: [
            { target: "Soekarno", aliases: ["soekarno", "sukarno", "bung karno"], clues: ["Presiden Indonesia pertama", "Bapak Proklamator Indonesia"] }
        ],
        menteri: [
            { target: "Sri Mulyani", aliases: ["sri mulyani", "sri mulyani indrawati"], clues: ["Menteri Keuangan Republik Indonesia di beberapa era", "Mantan Direktur Pelaksana Bank Dunia"] }
        ],
        pahlawan: [
            { target: "Diponegoro", aliases: ["diponegoro", "pangeran diponegoro"], clues: ["Pahlawan dari Jawa Tengah", "Memimpin Perang Jawa melawan Belanda (1825–1830)"] }
        ]
    };

    let database = JSON.parse(localStorage.getItem('custom_game_database')) || defaultDatabase;
    let isAdminAuthenticated = false;
    let pendingAdminAction = null;

    let currentCategory = "";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let timer = 30;
    let timerInterval = null;
    let hintsLeft = 2;

    function requestAdminAccess(action) {
        if (isAdminAuthenticated) {
            executeAdminAction(action);
        } else {
            pendingAdminAction = action;
            document.getElementById('login-modal').classList.remove('hidden');
            document.getElementById('admin-username-input').value = "";
            document.getElementById('admin-password-input').value = "";
            document.getElementById('login-error').classList.add('hidden');
        }
    }

    function verifyCredentials() {
        const inputUser = document.getElementById('admin-username-input').value;
        const inputPass = document.getElementById('admin-password-input').value;

        if (inputUser === ADMIN_USERNAME && inputPass === ADMIN_PASSWORD) {
            isAdminAuthenticated = true;
            closeLoginModal();
            executeAdminAction(pendingAdminAction);
        } else {
            document.getElementById('login-error').classList.remove('hidden');
        }
    }

    function closeLoginModal() {
        document.getElementById('login-modal').classList.add('hidden');
    }

    function executeAdminAction(action) {
        if (action === 'add') {
            document.getElementById('add-modal').classList.remove('hidden');
        } else if (action === 'manage') {
            document.getElementById('manage-modal').classList.remove('hidden');
            renderQuestionList();
        }
    }

    function closeAddModal() {
        document.getElementById('add-modal').classList.add('hidden');
        document.getElementById('add-question-form').reset();
    }

    function closeManageModal() {
        document.getElementById('manage-modal').classList.add('hidden');
    }

    function saveCustomQuestion(e) {
        e.preventDefault();

        const category = document.getElementById('new-category').value;
        const target = document.getElementById('new-target').value.trim();
        const aliasesRaw = document.getElementById('new-aliases').value;
        const clue1 = document.getElementById('new-clue1').value.trim();
        const clue2 = document.getElementById('new-clue2').value.trim();

        const aliases = aliasesRaw.split(',').map(a => a.trim().toLowerCase()).filter(a => a.length > 0);
        if (!aliases.includes(target.toLowerCase())) {
            aliases.push(target.toLowerCase());
        }

        const clues = [clue1];
        if (clue2) clues.push(clue2);

        database[category].push({ target, aliases, clues });
        localStorage.setItem('custom_game_database', JSON.stringify(database));

        alert('Soal baru berhasil ditambahkan oleh Admin!');
        closeAddModal();
    }

    function renderQuestionList() {
        const cat = document.getElementById('manage-category-select').value;
        const container = document.getElementById('question-list-container');
        container.innerHTML = "";

        const questions = database[cat] || [];
        if (questions.length === 0) {
            container.innerHTML = "<p style='color: #94a3b8;'>Belum ada soal pada kategori ini.</p>";
            return;
        }

        questions.forEach((q, index) => {
            const item = document.createElement('div');
            item.className = 'question-list-item';
            item.innerHTML = `
                <div>
                    <strong>${q.target}</strong>
                    <div style="font-size: 0.8rem; color: #94a3b8;">${q.clues[0]}</div>
                </div>
                <button class="btn-delete" onclick="deleteQuestion('${cat}', ${index})">Hapus</button>
            `;
            container.appendChild(item);
        });
    }

    function deleteQuestion(cat, index) {
        if (confirm("Yakin ingin menghapus soal ini?")) {
            database[cat].splice(index, 1);
            localStorage.setItem('custom_game_database', JSON.stringify(database));
            renderQuestionList();
        }
    }

    function startGame(category) {
        currentCategory = category;
        currentQuestions = [...database[category]].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        score = 0;

        if (currentQuestions.length === 0) {
            alert("Kategori ini belum memiliki soal.");
            return;
        }

        document.getElementById('category-title').innerText = category.toUpperCase();
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('score').innerText = score;
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= currentQuestions.length) {
            alert(`Selesai! Skor Akhir: ${score}`);
            backToMenu();
            return;
        }

        clearInterval(timerInterval);
        timer = 30;
        hintsLeft = 2;

        document.getElementById('question-number').innerText = `${currentIndex + 1}/${currentQuestions.length}`;
        document.getElementById('timer').innerText = timer;
        document.getElementById('hint-count').innerText = hintsLeft;
        document.getElementById('answer-input').value = "";
        document.getElementById('feedback').innerText = "";

        const q = currentQuestions[currentIndex];
        document.getElementById('clue-text').innerText = q.clues[0];

        timerInterval = setInterval(() => {
            timer--;
            document.getElementById('timer').innerText = timer;
            if (timer <= 0) {
                clearInterval(timerInterval);
                showFeedback("Waktu Habis! Jawaban: " + q.target, false);
                setTimeout(nextQuestion, 2000);
            }
        }, 1000);
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input').value.trim().toLowerCase();
        const q = currentQuestions[currentIndex];
        if (!input) return;

        if (q.aliases.some(alias => alias === input)) {
            clearInterval(timerInterval);
            score += timer * 10;
            document.getElementById('score').innerText = score;
            showFeedback("Jawaban Benar! 🎉", true);
            setTimeout(nextQuestion, 1500);
        } else {
            showFeedback("Jawaban Salah!", false);
        }
    }

    function useHint() {
        if (hintsLeft <= 0) return;
        const q = currentQuestions[currentIndex];
        hintsLeft--;
        document.getElementById('hint-count').innerText = hintsLeft;

        if (hintsLeft === 1 && q.clues[1]) {
            document.getElementById('clue-text').innerText += " | " + q.clues[1];
        } else {
            const mask = q.target.replace(/[a-zA-Z]/g, (char, i) => i % 2 === 0 ? char : '_');
            document.getElementById('clue-text').innerText += ` | Bocoran: ${mask}`;
        }
    }

    function showFeedback(text, isSuccess) {
        const fb = document.getElementById('feedback');
        fb.innerText = text;
        fb.className = "feedback " + (isSuccess ? "success" : "error");
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function backToMenu() {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('menu-screen').classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>

</body>
</html>
